{% extends "base.html" %}

{% block title %}Редагування профілю{% endblock %}

{% block content %}
<h1>Редагування профілю</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Зберегти зміни</button>
</form>
<a href="{% url 'profile' %}" class="btn btn-secondary">Назад до профілю</a>
{% endblock %}
