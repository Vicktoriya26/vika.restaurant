{% extends "base.html" %}

{% block title %}Профіль користувача{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Профіль користувача</h2>
  <p><strong>Ім'я користувача:</strong> {{ user.username }}</p>
  <p><strong>Email:</strong> {{ user.email }}</p>
  <p><strong>Телефон:</strong> {{ user.phone }}</p>
  <p><strong>Адреса:</strong> {{ user.address }}</p>

  <a href="{% url 'profile_edit' %}" class="btn btn-primary">Редагувати профіль</a>

  <form action="{% url 'logout' %}" method="post" style="display:inline-block;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Вийти</button>
  </form>
</div>
{% endblock %}
