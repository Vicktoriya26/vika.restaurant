{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Увійти</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Увійти</button>
    </form>

    <p class="mt-3">
        Немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a>
    </p>
</div>
{% endblock %}
