<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ресторанний додаток{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🍴 Ресторан</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Профіль</a></li>
          <li class="nav-item"><a class="nav-link" href=" ">Вийти</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href=" ">Увійти</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Реєстрація</a></li>
        {% endif %}
        <li class="nav-item"><a class="nav-link" href=" "> Кошик</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
