<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vika_restaurant{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ТУТ ВСТАВЛЯЄМО КОД -->
    <style>
        .btn-Chocolate {
            background-color: #6e3217 !important; /* молочний шоколад */
            color: white !important;
            border: none;
            border-radius: 5px;
            padding: 5px 15px;
            margin-right: 5px;
        }
        .btn-Chocolate:hover {
            background-color: #6e3217 !important; /* темніший при наведенні */
            color: white !important;
        }
    </style>
</head>


        <!-- Кнопка кошика -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'cart:cart_detail' %}">
            <i class="bi bi-cart"></i>
            {% if cart|length > 0 %}
              <span class="badge bg-danger">{{ cart|length }}</span>
            {% endif %}
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>


<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <!-- Логотип і назва ресторану ведуть на головну сторінку меню -->
        <a class="navbar-brand d-flex align-items-center" href="{% url 'menu:product_list' %}">
            <img src="https://cdn-icons-png.flaticon.com/512/562/562678.png" 
                 alt="Логотип ресторану" width="40" height="40" class="d-inline-block align-text-top me-2">
            Vika_restaurant
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <!-- Кнопки для авторизованих -->
                    <li class="nav-item">
                        <a class="btn btn-Chocolate me-2 text-primary" href="{% url 'profile' %}">Профіль</a>
                    </li>
                    <li class="nav-item d-flex align-items-center">
                        <form action="{% url 'logout' %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-Chocolate me-2 text-primary"
                                    style="padding:0; border:none; background:none;">Вийти</button>
                        </form>
                    </li>
                {% else %}
                    <!-- Кнопки для гостей -->
                    <li class="nav-item">
                        <a class="btn btn-Chocolate me-2 text-primary" href="{% url 'login' %}">Увійти</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-Chocolate me-2 text-primary" href="{% url 'register' %}">Реєстрація</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<script>
function openCart() {
    fetch("{% url 'cart:cart_detail' %}")
        .then(response => response.text())
        .then(html => {
            document.getElementById("cart-modal-body").innerHTML = html;
            new bootstrap.Modal(document.getElementById('cartModal')).show();
        });
}
</script>
