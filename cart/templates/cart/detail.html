<h2>Кошик</h2>

{% if cart %}
<table>
    <tr>
        <th>Страва</th>
        <th>Ціна</th>
        <th>Кількість</th>
        <th>Сума</th>
        <th></th>
    </tr>

    {% for item in cart %}
    <tr>
        <td>{{ item.dish.name }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.total_price }}</td>
        <td>
            <a href="{% url 'cart:remove' item.dish.id %}">Видалити</a>
        </td>
    </tr>
    {% endfor %}
</table>

<h3>Загальна сума: {{ cart.get_total_price }}</h3>
<a href="{% url 'cart:clear' %}">Очистити кошик</a>

{% else %}
<p>Кошик порожній</p>
{% endif %}
